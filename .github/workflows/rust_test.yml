name: Rust Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust_test.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust_test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kornia-slam
        uses: actions/checkout@v4
        with:
          path: kornia-slam

      - name: Checkout kornia-rs
        uses: actions/checkout@v4
        with:
          repository: kornia/kornia-rs
          path: kornia-rs

      - name: Restore sibling path layout
        run: ln -s "$GITHUB_WORKSPACE/kornia-rs" "$GITHUB_WORKSPACE/../kornia-rs"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: kornia-slam
        run: cargo test
