[package]
name = "kornia-slam"
version = "0.1.0"
edition = "2024"
description = "SLAM building blocks for kornia-rs"

[dependencies]
kornia-3d = { path = "../kornia-rs/crates/kornia-3d" }
kornia-algebra = { path = "../kornia-rs/crates/kornia-algebra" }
kornia-image = { path = "../kornia-rs/crates/kornia-image" }
kornia-imgproc = { path = "../kornia-rs/crates/kornia-imgproc" }
thiserror = "2"

[dev-dependencies]
argh = "0.1"
kornia-io = { path = "../kornia-rs/crates/kornia-io" }
kornia-tensor = { path = "../kornia-rs/crates/kornia-tensor" }
rerun = "0.29.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[example]]
name = "orb_slam"
path = "examples/orb_slam/main.rs"
